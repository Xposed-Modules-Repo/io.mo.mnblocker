plugins {
    id 'com.android.application'
}

android {
    namespace 'io.mo.mnblocker'
    compileSdk 34

    defaultConfig {
        applicationId "io.mo.mnblocker"
        minSdk 24            // Android 7.0 — NotificationChannel API starts at 26, lower kept for legacy install
        targetSdk 34
        versionCode 10
        versionName "1.2.5"
    }

    // CI signing (.github/workflows/build-release.yml). Only active when the
    // keystore env vars are set, so a local Android Studio "Generate Signed APK"
    // and a plain ./gradlew assembleRelease behave exactly as before. The key
    // itself never lives in the repo — CI decodes it from a secret.
    def ciKeystore = System.getenv("RELEASE_KEYSTORE_PATH")

    signingConfigs {
        if (ciKeystore) {
            release {
                storeFile file(ciKeystore)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        // HookAliveStore stamps BuildConfig.VERSION_NAME into its beacon so the
        // UI can tell a live hook built from this APK from one still running the
        // previous version out of system_server.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API — compileOnly so it is NOT bundled into the apk (provided by LSPosed at runtime)
    compileOnly 'de.robv.android.xposed:api:82'

    // Local JVM unit tests for the pure rule engine (RuleMatcher).
    testImplementation 'junit:junit:4.13.2'
    // Android's mockable android.jar stubs org.json (throws on every call) in
    // plain JVM unit tests; the real impl is needed to test the root-free
    // stores' JSON read/write. Test-only — never bundled into the APK.
    testImplementation 'org.json:json:20231013'
}
