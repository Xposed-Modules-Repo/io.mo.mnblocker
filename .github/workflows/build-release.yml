name: Build release APK

# Push a tag shaped <versionCode>-<versionName> (e.g. 11-1.2.6) to build, test,
# sign and attach the APK to a DRAFT release. Write the notes and click
# Publish yourself: that publish (by you, not by this workflow's token) is what
# fires release-sync.yml and mirrors the release to Xposed-Modules-Repo.
#
# Run it manually (Actions → Run workflow) to get a signed APK as a build
# artifact without touching releases.
on:
  push:
    tags:
      - '[0-9]+-*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the certificate every published release so far is signed with
      # (CN=mo, read from 10-1.2.5). An APK signed with any other key cannot
      # update an existing install, so a mismatch fails the build.
      EXPECTED_CERT_SHA256: 20e354f32bda7574dcc747150e4f5a267a2d3bca50eb4656a3be7380cd4f96bc
      APK: app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle
        id: ver
        run: |
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p' app/build.gradle)
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' app/build.gradle)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error::Could not read versionCode / versionName from app/build.gradle"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$code-$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name ($code)"

      - name: Tag must match the version in build.gradle
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.ver.outputs.tag }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle (${{ steps.ver.outputs.tag }}). Bump versionCode/versionName first."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify signing certificate
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          actual=$("${bt}apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Signed with: $actual"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the release certificate (expected $EXPECTED_CERT_SHA256). Users could not update over the existing install."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.ver.outputs.tag }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Create or update draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.ver.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for an existing release: replace the APK, leave notes alone.
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --draft \
              --verify-tag \
              --title "$TITLE" \
              --generate-notes
          fi
